name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate index
        run: npm run generate-index

      - name: Build Quartz
        run: npx quartz build
        env:
          BASE_URL: alessandrovisentini.github.io/carta-cartorum

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed content files since last release
        id: changed-files
        run: |
          # Get the latest release tag
          LAST_TAG=$(git tag --sort=-v:refname | head -1)

          if [ -z "$LAST_TAG" ]; then
            # No previous release — list all content files
            ALL_FILES=$(git ls-files 'content/**/*.md')
          else
            ALL_FILES=$(git diff --name-only "$LAST_TAG" HEAD -- 'content/**/*.md')
          fi

          if [ -z "$ALL_FILES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_changes=true" >> $GITHUB_OUTPUT

          TOTAL=$(echo "$ALL_FILES" | wc -l)
          MAX_SHOWN=10

          # Format the list for Discord (extract just the page names)
          FILE_LIST=""
          COUNT=0
          while IFS= read -r file; do
            COUNT=$((COUNT + 1))
            if [ "$COUNT" -gt "$MAX_SHOWN" ]; then
              REMAINING=$((TOTAL - MAX_SHOWN))
              FILE_LIST="${FILE_LIST}...e altre ${REMAINING} pagine\n"
              break
            fi
            PAGE_NAME=$(basename "$file" .md)
            FILE_LIST="${FILE_LIST}• ${PAGE_NAME}\n"
          done <<< "$ALL_FILES"

          echo "file_list<<EOF" >> $GITHUB_OUTPUT
          echo -e "$FILE_LIST" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release
        if: steps.changed-files.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_TAG=$(git tag --sort=-v:refname | head -1)

          if [ -z "$LAST_TAG" ]; then
            NEW_TAG="v0.1.0"
          else
            MINOR=$(echo "$LAST_TAG" | sed 's/v0\.\([0-9]*\)\..*/\1/')
            NEW_TAG="v0.$((MINOR + 1)).0"
          fi

          gh release create "$NEW_TAG" \
            --title "Wiki Update $NEW_TAG" \
            --generate-notes \
            --latest

      - name: Send Discord notification
        if: steps.changed-files.outputs.has_changes == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          FILE_LIST: ${{ steps.changed-files.outputs.file_list }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          MESSAGE=$(printf '📜 **La Wiki è stata aggiornata!**\n\n**Pagine modificate:**\n%s\n🔗 Visita la wiki: %s' "$FILE_LIST" "$PAGE_URL")

          PAYLOAD=$(jq -n --arg msg "$MESSAGE" '{content: $msg}')

          curl -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK"
